# Builds Just for Windows, macOS and Android on every v* tag and attaches the zips to
# the GitHub release. Runs in the public repo me0wdes/just.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.47.7

jobs:
  windows:
    # VS 2022: a plugin still includes <experimental/coroutine>, which the
    # VS 2026 STL on windows-latest rejects (STL1011).
    runs-on: windows-2022
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '${{ env.FLUTTER_VERSION }}', channel: stable, cache: true }
      - run: flutter pub get
      # Plugin junctions, in case the runner refuses symlinks.
      - run: ../tools/setup-plugin-links.ps1
        shell: pwsh
      - run: flutter analyze
      - name: Build
        shell: pwsh
        run: |
          # The version comes from pubspec, so a manual run builds the same thing.
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([^+\s]+)').Matches[0].Groups[1].Value
          flutter build windows --release --no-pub --build-name $version --dart-define=JUST_VERSION=$version
          if ($LASTEXITCODE -ne 0) { throw 'Windows build failed' }
          $runner = 'build/windows/x64/runner/Release'
          # App-local VC runtime, so the zip runs without the redistributable.
          $vs = & 'C:/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe' -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $redist = Get-ChildItem "$vs/VC/Redist/MSVC" -Directory | Where-Object { $_.Name -match '^\d+\.\d+\.\d+$' } | Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          $crt = Get-ChildItem "$($redist.FullName)/x64" -Directory -Filter 'Microsoft.VC14*.CRT' | Select-Object -First 1
          if (-not $crt) { throw 'VC runtime not found' }
          Copy-Item "$($crt.FullName)/*.dll" $runner
          New-Item -ItemType Directory -Force ../dist | Out-Null
          Compress-Archive -Path "$runner/*" -DestinationPath "../dist/Just-$version-Windows.zip"
          # Installer: Inno Setup ships with the windows-2022 image.
          $iscc = 'C:/Program Files (x86)/Inno Setup 6/ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /Q "/DAppVersion=$version" "/DSourceDir=$((Resolve-Path $runner).Path)" "/DOutputDir=$((Resolve-Path ../dist).Path)" ../tools/installer/just.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: 'dist/*' }

  macos:
    runs-on: macos-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '${{ env.FLUTTER_VERSION }}', channel: stable, cache: true }
      - run: flutter pub get
      - name: Build
        run: |
          version=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)
          flutter build macos --release --build-name "$version" --dart-define=JUST_VERSION="$version"
          mkdir -p ../dist
          ditto -c -k --keepParent build/macos/Build/Products/Release/Just.app "../dist/Just-$version-macOS.zip"
          # Disk image with the usual «drag to Applications» layout.
          stage=$(mktemp -d)
          cp -R build/macos/Build/Products/Release/Just.app "$stage/"
          ln -s /Applications "$stage/Applications"
          hdiutil create -volname Just -srcfolder "$stage" -ov -format UDZO "../dist/Just-$version.dmg"
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: 'dist/*' }

  android:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '${{ env.FLUTTER_VERSION }}', channel: stable, cache: true }
      - run: flutter pub get
      - name: Build
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          # Every release must carry the same key, or it will not install over the last one.
          test -n "$KEYSTORE" || { echo 'ANDROID_KEYSTORE secret is missing'; exit 1; }
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/just.jks"
          printf '%s' "$KEYSTORE" | base64 -d > "$ANDROID_KEYSTORE_PATH"
          version=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)
          flutter build apk --release --build-name "$version" --dart-define=JUST_VERSION="$version"
          mkdir -p ../dist
          cp build/app/outputs/flutter-apk/app-release.apk "../dist/Just-$version-Android.apk"
      - uses: actions/upload-artifact@v4
        with: { name: android, path: 'dist/*' }

  publish:
    # A manual run only checks the builds; releases come from v* tags.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - run: cd dist && sha256sum *.zip *.exe *.dmg *.apk > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body: |
            **Windows:** скачайте `Just-Setup-….exe` и запустите. Права администратора не нужны, Just появится в меню «Пуск». Без установки: `Just-…-Windows.zip`, распакуйте и запустите `day_planner.exe`.
            Установщик пока без подписи: если Windows покажет «Неизвестный издатель», нажмите «Подробнее» → «Выполнить в любом случае».

            **macOS:** откройте `Just-….dmg` и перетащите Just в «Программы». Сборка без подписи Apple: при первом запуске откройте через правый клик → «Открыть».

            **Android:** скачайте `Just-…-Android.apk` на телефон и откройте. Если Android спросит, разрешите браузеру устанавливать приложения.

            **Синхронизация (по желанию):** поставьте свой сервер одной командой на Linux-сервере
            `curl -fsSL https://raw.githubusercontent.com/me0wdes/just/main/server/install.sh | sudo bash`
            и вставьте строку подключения в Just: Настройки → Хранение данных → Свой сервер. Без сервера всё работает на устройстве.

            Обновления приходят сами: Just раз в несколько часов проверяет новые версии и предлагает обновиться. На Windows установщик ставит новую версию и перезапускает Just. Свой сервер обновляется сам каждую ночь.

            Контрольные суммы — в SHA256SUMS.txt.
